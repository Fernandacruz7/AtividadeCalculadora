<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
</head>

<body style="
    background-color: #f1f1f1;
    font-family: Arial, sans-serif;
    text-align: center;
">

    <div style="background-color: white; 
                width: 400px; 
                margin: 100px auto; 
                padding: 30px; 
                border-radius: 15px;">

    <h1 style="font-size: 36px; margin-bottom: 30px;" >Calculadora</h1>

    <input type="number" id="numero1" placeholder="Digite o primeiro número"  style="
                width: 100%;
                box-sizing: border-box;
                padding: 12px;
                margin-bottom: 12px;
                font-size: 16px;
            ">

    <input type="number" id="numero2" placeholder="Digite o segundo número" style="
                width: 100%;
                box-sizing: border-box;
                padding: 12px;
                margin-bottom: 12px;
                font-size: 16px;">
    <br><br>

    <button onclick="somar()"  style="
                width: 76px;
                height: 48px;
                font-size: 18px;
                margin-right: 6px; background-color:rgb(250, 212, 218);"
                >+</button>

    <button onclick="subtrair()"  style="
                width: 76px;
                height: 48px;
                font-size: 18px;
                margin-right: 6px; background-color:rgb(250, 212, 218);" 
                >-</button>

    <button onclick="multiplicar()"  style="
                width: 76px;
                height: 48px;
                font-size: 18px;
                margin-right: 6px; background-color:rgb(250, 212, 218);" 
                >*</button>

    <button onclick="dividir()"  style="
                width: 76px;
                height: 48px;
                font-size: 18px;
                margin-right: 6px; background-color:rgb(250, 212, 218);"
                >/</button>

    <button onclick="limpar()"style="padding: 12px 16px; font-size: 16px; margin-top: 10px;  background-color:rgb(250, 212, 218)">Limpar</button> 
    <br><br>
        

    <h2 id="resultado" style="
            width: 106px;
            height: 98px;
            text-align: left;
            margin-top: 10px;
            font-size: 30px;"
             >Resultado:</h2>

    <script src="script.js"></script>


</body>
</html>
